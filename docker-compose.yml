services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-cpu
    ports:
      - ${OLLAMA_PORT}:11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Force Ollama to use CPU only (no GPU)
      - OLLAMA_NOPRUNE=1
    restart: unless-stopped
    networks:
      - ollama-net

  # This service waits for Ollama to be ready and then pulls the specified model.
  ollama-model-puller:
    image: alpine:latest
    container_name: ollama-model-puller
    depends_on:
      - ollama
    networks:
      - ollama-net
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Ollama to start...';
      while ! nc -z ollama 11434; do sleep 2; done;
      echo 'Ollama is ready. Starting model download...';
      apk add --no-cache curl;
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:14b\"}';
      echo 'Model download complete!';
      "

volumes:
  ollama_data:
    driver: local
    name: ${NETWORK_NAME}

networks:
  ollama-net:
    driver: bridge
    
